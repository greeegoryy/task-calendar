
name: Task Calendar CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  # =========================
  # FRONTEND
  # =========================
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build React application
        working-directory: ./frontend
        run: npm run build

  # =========================
  # BACKEND
  # =========================
  backend:
    name: Test Backend
    runs-on: ubuntu-latest

    # Temporary PostgreSQL database for integration tests
    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: calendar
          POSTGRES_PASSWORD: calendar_test_password
          POSTGRES_DB: calendar_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U calendar -d calendar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Environment variables for backend tests
    env:
      DATABASE_URL: postgresql+psycopg://calendar:calendar_test_password@localhost:5432/calendar_test
      TEST_DATABASE_URL: postgresql+psycopg://calendar:calendar_test_password@localhost:5432/calendar_test

      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: noreply@dailyflow.local

    steps:
      # Download repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Python 3.12
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install backend dependencies
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      # Validate Python syntax
      - name: Check Python syntax
        run: python -m compileall -q backend/app

      # Create database schema using Alembic
      - name: Apply Alembic migrations
        working-directory: ./backend
        run: python -m alembic upgrade head

      # Run all backend tests
      - name: Run backend tests
        working-directory: ./backend
        run: python -m pytest tests/ -v

  # =========================
  # DOCKER BUILD & PUSH
  # =========================
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    # Docker builds start only after frontend and backend pass
    needs: [frontend, backend]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image names
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          REPO=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "frontend=ghcr.io/${REPO}-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${REPO}-backend" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
