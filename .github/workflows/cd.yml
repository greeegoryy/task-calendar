
name: Task Calendar CD

on:
  workflow_run:
    workflows: ["Task Calendar CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: task-calendar-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GKE

    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1010306594671/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-deployer@task-calendar-515012.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: task-calendar-gke
          location: europe-west3-a
          project_id: task-calendar-515012

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify deployment target
        run: |
          kubectl config current-context
          kubectl get namespace task-calendar

      - name: Deploy backend
        env:
          IMAGE: ghcr.io/greeegoryy/task-calendar-backend:${{ github.event.workflow_run.head_sha }}
        run: |
          kubectl -n task-calendar set image deployment/backend backend="$IMAGE"
          kubectl -n task-calendar rollout status deployment/backend --timeout=180s

      - name: Deploy frontend
        env:
          IMAGE: ghcr.io/greeegoryy/task-calendar-frontend:${{ github.event.workflow_run.head_sha }}
        run: |
          kubectl -n task-calendar set image deployment/frontend frontend="$IMAGE"
          kubectl -n task-calendar rollout status deployment/frontend --timeout=180s

      - name: Verify deployments
        run: |
          kubectl get deployments -n task-calendar
          kubectl get pods -n task-calendar
