
name: Task Calendar CD

on:
  workflow_run:
    workflows: ["Task Calendar CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: task-calendar-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GKE

    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    runs-on: ubuntu-latest

    steps:
      # Checkout the exact commit that passed CI
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Prevent deployment of an outdated commit
      - name: Verify commit is current main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          CURRENT_SHA=$(gh api "repos/${GH_REPO}/branches/main" \
            --jq '.commit.sha')

          echo "CI commit: $EXPECTED_SHA"
          echo "Current main: $CURRENT_SHA"

          if [ "$EXPECTED_SHA" != "$CURRENT_SHA" ]; then
            echo "Skipping deployment: a newer commit exists on main."
            exit 1
          fi

          echo "Commit verified. Continuing deployment."

      # Authenticate using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1010306594671/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-deployer@task-calendar-515012.iam.gserviceaccount.com

      # Connect to the GKE cluster
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: task-calendar-gke
          location: europe-west3-a
          project_id: task-calendar-515012

      # Install kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # Verify cluster and existing deployments
      - name: Verify deployment target
        run: |
          set -euo pipefail

          kubectl config current-context
          kubectl -n task-calendar get deployments backend frontend

      # Run database migrations before deploying backend
      - name: Run database migrations
        env:
          BACKEND_IMAGE: ghcr.io/greeegoryy/task-calendar-backend:${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          JOB_NAME="alembic-migration-${RUN_ID}-${RUN_ATTEMPT}"

          echo "Migration Job: ${JOB_NAME}"
          echo "Backend image: ${BACKEND_IMAGE}"

          sed \
            -e "s/name: alembic-migration$/name: ${JOB_NAME}/" \
            -e "s|BACKEND_IMAGE_PLACEHOLDER|${BACKEND_IMAGE}|g" \
            infrastructure/kubernetes/alembic-migration-job.yaml \
            > /tmp/alembic-migration-job.yaml

          kubectl -n task-calendar create \
            -f /tmp/alembic-migration-job.yaml

          if ! kubectl -n task-calendar wait \
            --for=condition=complete \
            "job/${JOB_NAME}" \
            --timeout=360s; then

            echo "Database migration failed or timed out."

            kubectl -n task-calendar describe \
              "job/${JOB_NAME}" || true

            kubectl -n task-calendar logs \
              "job/${JOB_NAME}" \
              --all-containers=true \
              --tail=100 || true

            exit 1
          fi

          echo "Database migrations completed successfully."

          kubectl -n task-calendar logs \
            "job/${JOB_NAME}" \
            --all-containers=true

      # Render and deploy backend manifest using tested image
      - name: Deploy backend
        env:
          BACKEND_IMAGE: ghcr.io/greeegoryy/task-calendar-backend:${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          echo "Preparing backend manifest."
          echo "Backend image: ${BACKEND_IMAGE}"

          sed \
            "s|image: ghcr.io/greeegoryy/task-calendar-backend:latest|image: ${BACKEND_IMAGE}|" \
            infrastructure/kubernetes/backend.yaml \
            > /tmp/backend.yaml

          # Verify that the expected image was inserted
          grep -Fq "image: ${BACKEND_IMAGE}" /tmp/backend.yaml

          # Validate the generated manifest
          kubectl apply --dry-run=client \
            -f /tmp/backend.yaml

          # Apply configuration and tested image together
          kubectl apply \
            -f /tmp/backend.yaml

          # Wait for the backend to become healthy
          kubectl -n task-calendar rollout status \
            deployment/backend \
            --timeout=180s

      # Deploy frontend
      - name: Deploy frontend
        env:
          IMAGE: ghcr.io/greeegoryy/task-calendar-frontend:${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          kubectl -n task-calendar set image \
            deployment/frontend \
            frontend="${IMAGE}"

          kubectl -n task-calendar rollout status \
            deployment/frontend \
            --timeout=180s

      # Verify final deployment state
      - name: Verify deployments
        run: |
          set -euo pipefail

          kubectl -n task-calendar get deployments backend frontend
          kubectl -n task-calendar get pods

          echo "Backend image:"
          kubectl -n task-calendar get deployment backend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""
          echo "Frontend image:"
          kubectl -n task-calendar get deployment frontend \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

      - name: Smoke test through public HTTPS
        env:
          DAILYFLOW_URL: https://dailyflow-app.duckdns.org
        run: bash scripts/smoke-test.sh "$DAILYFLOW_URL"
