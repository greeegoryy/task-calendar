services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      POSTGRES_DB: calendar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: &database_url postgresql+psycopg://calendar:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/calendar
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: *database_url
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: noreply@dailyflow.local
      COOKIE_SECURE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
     - "127.0.0.1:8025:8025"
    expose:
     - "1025"

volumes:
  postgres_data:
