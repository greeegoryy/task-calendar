
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: task-calendar

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/greeegoryy/task-calendar-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            # PostgreSQL connection
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: database-url

            # Temporary SMTP configuration
            - name: SMTP_HOST
              value: "localhost"

            - name: SMTP_PORT
              value: "1025"

            - name: SMTP_FROM_EMAIL
              value: "noreply@dailyflow.local"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: task-calendar

spec:
  selector:
    app: backend

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

  type: ClusterIP
