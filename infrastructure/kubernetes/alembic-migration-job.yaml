
apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-migration
  namespace: task-calendar
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400

  template:
    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: alembic
          image: BACKEND_IMAGE_PLACEHOLDER
          imagePullPolicy: Always

          workingDir: /app

          command:
            - alembic
            - -c
            - /app/alembic.ini
            - upgrade
            - head

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: database-url
